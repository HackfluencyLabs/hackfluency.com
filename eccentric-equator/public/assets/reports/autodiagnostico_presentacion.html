<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200, minimum-scale=0.25, maximum-scale=5, user-scalable=yes">
<title>Autodiagnóstico Regulatorio — Chile 2026</title>
<style>
:root{--bg:#1A1A18;--bg2:#232321;--card:#262624;--line:#383836;--txt:#F5F5F4;--mut:#B0B0AA;--dim:#8A8A84;--lc:#DC3545;--lo:#5B6ABF;--lm:#6F42C1;--ng:#E67E22;--bd:#28A745;--ok:#2D6A4F}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'Segoe UI',Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{overflow:hidden}
#top{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(26,26,24,.82);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:50}
#brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.5px;font-size:15px}
#brand-home{color:#F5F4ED;cursor:pointer;transition:opacity .2s;display:inline-flex}
#brand-home:hover{opacity:.8}
#brand-home #brand{color:#F5F4ED}
#brand .dot{width:11px;height:11px;border-radius:50%;background:linear-gradient(135deg,var(--lc),var(--ng));box-shadow:0 0 12px rgba(230,126,34,.5);flex:0 0 auto}
#btsub{display:block;font-weight:400;color:var(--mut);font-size:11px;letter-spacing:.3px;margin-top:1px}
#stepper{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--mut);font-weight:600}
#stepper b{color:var(--txt)}
#progwrap{width:120px;height:5px;background:var(--line);border-radius:4px;overflow:hidden}
#progfill{height:100%;width:0;background:linear-gradient(90deg,var(--ng),var(--bd));border-radius:4px;transition:width .5s}
#deck{position:fixed;inset:0;top:56px}
.slide{position:absolute;inset:0;display:none;align-items:flex-start;justify-content:center;padding:30px 5vw;overflow:auto}
.slide.active{display:flex;animation:pop .4s ease}
@keyframes pop{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.inner{width:100%;max-width:1000px;margin:2vh auto}
.center{text-align:center}
.center .inner{margin:auto}
.kicker{font-size:12px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:var(--ng);margin-bottom:12px}
h1{font-size:clamp(32px,4.8vw,56px);line-height:1.06;font-weight:800;letter-spacing:-1px;margin:6px 0 14px}
h2{font-size:clamp(24px,3.4vw,40px);font-weight:800;letter-spacing:-.5px;margin:6px 0 12px}
.sub{color:var(--mut);font-size:clamp(15px,2vw,19px);line-height:1.6;max-width:800px;margin:0 auto 4px}
.center .sub{margin:0 auto}
.btn{display:inline-flex;align-items:center;gap:9px;padding:14px 28px;border-radius:12px;border:0;font-size:15px;font-weight:700;cursor:pointer;color:#fff;transition:.2s;background:linear-gradient(135deg,#2D6A4F,#1F513B);box-shadow:0 8px 20px rgba(0,0,0,.35)}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--mut)}
.btn.big{padding:18px 36px;font-size:17px}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.row-btn{display:flex;gap:14px;justify-content:center;margin-top:26px;flex-wrap:wrap}
.grid{display:grid;gap:14px;margin-top:20px}
.g3{grid-template-columns:repeat(auto-fit,minmax(255px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;cursor:pointer;transition:.2s;text-align:left;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.card:hover{transform:translateY(-3px);border-color:#444}
.card .tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.8px;padding:3px 10px;border-radius:8px;margin-bottom:10px}
.card h3{font-size:15.5px;font-weight:800;margin-bottom:5px}
.card .mini{font-size:12.5px;color:var(--mut);line-height:1.5}
.card .ext{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:14px;line-height:1.6;color:#fff}
.card .ext.open{display:block}
.card .ext b{color:var(--ok);font-size:11px;letter-spacing:1px;text-transform:uppercase}
.card .hint{display:inline-block;margin-top:11px;font-size:11px;color:var(--dim);font-weight:700}
.qbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 32px;margin-top:16px;text-align:left}
.qnum{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--ng);text-transform:uppercase}
.qtext{font-size:clamp(21px,3vw,32px);font-weight:800;line-height:1.25;margin:10px 0 8px}
.qdesc{color:var(--mut);font-size:15.5px;line-height:1.5;margin-bottom:6px}
.qdef{margin-top:14px;background:rgba(230,126,34,.07);border-left:3px solid var(--ng);padding:12px 16px;border-radius:0 10px 10px 0;font-size:13.5px;line-height:1.6;color:#F0E6D8}
.qdef b{color:var(--ng)}
.yn{display:flex;gap:14px;margin-top:24px;flex-wrap:wrap}
.yn button{flex:1;min-width:150px;padding:17px;border-radius:14px;border:2px solid var(--line);background:var(--bg2);color:var(--txt);font-size:18px;font-weight:800;cursor:pointer;transition:.2s}
.yn .y:hover{border-color:var(--ok);background:rgba(45,106,79,.2)}
.yn .n:hover{border-color:var(--lc);background:rgba(220,53,69,.15)}
.yn button.done{opacity:.45;transform:none;cursor:default;border-style:dashed}
.ck{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:.2s;text-align:left}
.ck:hover{border-color:var(--mut)}
.ck .tick{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center;transition:.2s;font-weight:800}
.ck.on{border-color:var(--ok);background:rgba(45,106,79,.12)}
.ck.on .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.ck .nm{font-weight:800;font-size:15px}
.ck .ds{font-size:12px;color:var(--mut);margin-top:2px}
.ck .gloss{margin-left:auto;font-size:10.5px;color:var(--dim);background:var(--bg2);padding:6px 9px;border-radius:8px;flex:0 0 auto;border:1px solid var(--line)}
.cklist{display:grid;gap:11px;margin-top:18px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}
.met{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center}
.met .num{font-size:clamp(28px,3.4vw,44px);font-weight:800;line-height:1}
.met .lab{font-size:12.5px;color:var(--mut);margin-top:8px;font-weight:600}
.bar{height:14px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:8px;transition:width .8s}
.prio{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--lc);border-radius:12px;padding:14px 18px;margin-top:12px;text-align:left}
.prio.no-gap{border-left-color:var(--ok)}
.prio h4{font-size:15.5px;font-weight:800}
.prio .ord{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 5px;border-radius:6px;background:#1A1A18;color:#fff;font-size:12px;font-weight:800;margin-right:8px;vertical-align:middle}
.prio .prhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.prio .prstat{font-size:11px;font-weight:800;color:var(--ok);background:rgba(45,106,79,.14);padding:4px 10px;border-radius:8px;white-space:nowrap}
.prio .prstat.warn{color:var(--ng);background:rgba(230,126,34,.14)}
.prio.hito{border-left:4px solid var(--ok)}
.prio .prstat.hito{color:var(--ok);background:rgba(45,106,79,.14)}
.prio .rq{display:flex;align-items:center;gap:9px;font-size:13.5px;line-height:1.55;color:#FFF6E0;padding:3px 0}
.prio .rq .rqmark{width:20px;flex:0 0 auto;text-align:center;font-weight:800}
.prio .rq.ok{color:#D8F3E0}
.prio .rq.ok .rqmark{color:var(--ok)}
.prio .rq.miss{color:#FFD9D9}
.prio .rq.miss .rqmark{color:var(--lc)}
.prio .rq .rqlaw{margin-left:auto;font-size:10.5px;color:var(--dim);background:var(--bg2);padding:3px 8px;border-radius:6px;border:1px solid var(--line);flex:0 0 auto;font-weight:700}
.prio .dst{font-size:13px;color:var(--mut);margin-top:3px}
.prio .reqs{margin-top:10px;border-top:1px dashed var(--line);padding-top:9px}
.prio .reqs .ship{color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:1px;font-weight:800;margin-bottom:5px}
.prio .reqs div{font-size:13.5px;line-height:1.55;color:#FFF6E0}
.sec{text-align:left;margin-top:22px}
.sec h3{font-size:12.5px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.ley{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:14px}
.ley-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.ley-n{display:flex;align-items:center;gap:9px}
.ley-tag{color:#fff;font-weight:800;font-size:10.5px;padding:3px 10px;border-radius:10px;letter-spacing:.4px}
.ley-name{font-size:15px;font-weight:800}
.ley-status{font-size:11px;font-weight:800;color:var(--ok);background:rgba(45,106,79,.14);padding:4px 10px;border-radius:8px;white-space:nowrap}
.ley-status.warn{color:#E67E22;background:rgba(230,126,34,.14)}
.rd{display:flex;align-items:flex-start;gap:10px;padding:6px 0;font-size:14px}
.rd .x{width:22px;flex:0 0 auto;text-align:center;font-weight:800}
#foot{position:fixed;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:11px;color:var(--dim);z-index:50;background:rgba(13,13,13,.72);backdrop-filter:blur(6px);border-top:1px solid var(--line)}
#foot>div:first-child{display:none}
#knav{display:flex;gap:9px;align-items:center;margin-left:auto}
#knav button{background:var(--bg2);border:1px solid var(--line);color:var(--txt);font-size:12px;padding:7px 13px;border-radius:9px;cursor:pointer;transition:.2s;font-weight:600}
#knav button:hover:not(:disabled){border-color:var(--mut)}
#knav button:disabled{opacity:.3;cursor:not-allowed}
#dots{display:flex;gap:6px}
#dots i{width:6px;height:6px;border-radius:50%;background:var(--line);transition:.2s}
#dots i.on{background:var(--ng);width:18px;border-radius:4px}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
/* ===== Hoja de cobertura (fidelidad del modelo) ===== */
.covcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;cursor:pointer;transition:.2s;text-align:left;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.covcard:hover{transform:translateY(-3px);border-color:#444}
.cov-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.cov-name{font-size:15px;font-weight:800;line-height:1.3;margin:2px 0 8px}
.cov-src{font-size:11px;font-weight:800;color:var(--ng);background:rgba(230,126,34,.08);border:1px solid rgba(230,126,34,.5);padding:6px 11px;border-radius:8px;cursor:pointer;flex:0 0 auto;white-space:nowrap;text-decoration:none;transition:.2s;font-family:inherit}
.cov-src:hover{background:rgba(230,126,34,.2)}
.cov-status{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:800;padding:4px 10px;border-radius:8px;white-space:nowrap}
.cov-note{font-size:12.5px;color:var(--mut)}
.covpro{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:11px}
.covpro i{display:block;height:100%;border-radius:6px}
.covcard .hint{display:inline-block;margin-top:11px;font-size:11px;color:var(--dim);font-weight:700}
.covcard .ext{display:none;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:14px;line-height:1.6;color:#fff}
.covcard .ext.open{display:block}
.covship{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;font-weight:800;margin:6px 0 8px}
.cov-rows{margin-top:6px}
.cov-r{display:flex;align-items:flex-start;gap:8px;padding:6px 0;font-size:13.5px;line-height:1.5;border-top:1px solid rgba(56,56,54,.5)}
.cov-r:first-child{border-top:0}
.cov-r .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;margin-top:6px}
.cov-r .ob{flex:1}
.cov-r .ob b{font-weight:700}
.cov-r .via{display:block;font-size:11px;color:var(--dim);margin-top:1px}
.cov-badge{font-size:10px;font-weight:800;border:1px solid;border-radius:8px;padding:2px 7px;white-space:nowrap;flex:0 0 auto}
/* ===== ROI de Cumplimiento: Matriz de Cobertura Legal por Control (chart del informe de convergencia) ===== */
.roim-wrap{overflow-x:auto;margin-top:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);padding:10px 12px}
.roim{border-collapse:collapse;font-size:10.5px;width:100%}
.roim th{font-weight:800;color:var(--mut);padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase;font-size:9.5px;letter-spacing:.4px}
.roim td{border:1px solid rgba(56,56,54,.6);width:26px;height:26px;text-align:center;font-weight:800;color:#fff}
.roim .roim-law{width:auto;min-width:150px;color:var(--txt);text-align:left;font-weight:700;background:transparent;white-space:nowrap}
.roim .roim-law .roim-fine{display:block;font-size:10px;color:var(--dim);font-weight:600;margin-top:2px}
.roim .roim-cell{color:transparent}
.roim .roim-cell.req{opacity:.55}
.roim .roim-cell.hit{outline:2px solid #fff;opacity:1}
@media(max-width:700px){.metrics{grid-template-columns:1fr}.qbox{padding:20px}
</style>
</head>
<body>
<div id="top">
  <a href="https://www.hackfluency.com/" id="brand-home" title="Hackfluency" aria-label="Hackfluency" style="text-decoration:none"><div id="brand"><span class="dot"></span><div>HACKFLUENCY<div id="btsub">Autodiagnóstico Regulatorio · Chile 2026</div></div></div></a>
  <div id="stepper">Paso <b id="step-cur">1</b>/<span id="step-tot">1</span><div id="progwrap"><div id="progfill"></div></div></div>
</div>
<div id="deck"></div>
<div id="foot">
  <div id="footnote">Convergencia Normativa · 21.663 · 21.719 · 21.595 · NCG 538 · BOD 26-04</div>
  <div id="knav"><button id="btn-prev">← Atrás</button><span id="dots"></span><button id="btn-next">Siguiente →</button></div>
</div>
<script>
/* ===== MODELO CANONICO — misma fuente que Sankey y ROI (convergencia_normativa.html) ===== */
var STD_DEFS=[
 {n:'ISO 27001 (SGSI)',leyes:{'21.663':'exige','21.719':'satisface'},ctrls:['SGSI ISO 27001','Evaluacion Riesgos','Auditoria Pentest','Capacitacion','Due Diligence Terceros','Plan Continuidad','Monitoreo SOC 24x7','Delegado Ciberseguridad']},
 {n:'NCG 538 (Regulacion CMF)',leyes:{'NCG':'exige','21.719':'satisface'},ctrls:['MFA Autenticacion','Cifrado AES / TLS']},
 {n:'BOD 26-04 (Gest. Vulnerabilidades)',leyes:{'21.663':'satisface'},ctrls:['Reporte Incidentes','Auditoria Pentest','Canal Disclosure']},
 {n:'Reporte y Notificacion',leyes:{'21.663':'exige','21.719':'exige'},ctrls:['Reporte Incidentes','Canal Disclosure']},
 {n:'Modelo de Prevencion de Delitos (Ley 20.393)',leyes:{'21.595':'exige'},ctrls:['Encargado de Prevencion','Matriz Riesgo Penal','Protocolos Prevencion','Canal Denuncias','Evaluacion Independiente']}
];
var MULTAS={'21.663':40000,'21.719':20000}; // UTM techo legal (Ley 21.663 Art.40; 21.719). 21.595 y NCG 538: sin multa UTM pero con sancion (penal / CMF).
var UTM_CLP=69611; // valor UTM (Feb 2026)
function fmtUTM(u){if(!u)return '';return u.toLocaleString('es-CL').replace(/,/g,'.')+' UTM';}
function fmtCLPm(u){return '~$'+Math.round(u*UTM_CLP/1e6)+'M CLP';}
/* Severidad ponderada por ley: el riesgo penal de la 21.595 supera cualquier multa (asignamos
   50000 > 40000 de la 21.663); luego multa del techo. NCG 538 sanciona (administrativa CMF) pero
   sin monto UTM propio, por lo que pesa 0 en la clave de orden (no es monetaria comparable).
   BOD es voluntaria (no sanciona). Se usa como clave primaria de prioridad y de orden de columnas. */
var lawSev=function(l){if(l==='21.595')return 50000;return MULTAS[l]||0;};
function sevLabel(l){if(l==='21.595')return 'sanción penal (presidio)';if(l==='NCG')return 'sanción CMF (multas)';if(MULTAS[l])return fmtUTM(MULTAS[l])+' ('+fmtCLPm(MULTAS[l])+')';return 'sin sanción modelada';}
/* Derivado: inventario 17 controles + vinculos control->leyes (clave canonica 'NCG') */
var CTRLS=[],ctrlLeyes={};
for(var di=0;di<STD_DEFS.length;di++){var sdD=STD_DEFS[di];
 for(var dd=0;dd<sdD.ctrls.length;dd++){var ccD=sdD.ctrls[dd];
  if(CTRLS.indexOf(ccD)<0)CTRLS.push(ccD);
  if(!ctrlLeyes[ccD])ctrlLeyes[ccD]=[];
  for(var lkN in sdD.leyes){if(ctrlLeyes[ccD].indexOf(lkN)<0)ctrlLeyes[ccD].push(lkN);}
 }}
var lawName={'21.663':'Ley 21.663 — Ciberseguridad e Infraestructura Crítica','21.719':'Ley 21.719 — Protección de Datos Personales','21.595':'Ley 21.595 — Delitos Económicos','NCG':'NCG 538 — CMF','BOD':'BOD 26-04 — CISA (voluntaria)'};
var lawColor={'21.663':'#DC3545','21.719':'#5B6ABF','21.595':'#6F42C1','NCG':'#E67E22','BOD':'#28A745'};
var ctrlDesc={'SGSI ISO 27001':'Tu sistema de gestión de seguridad','MFA Autenticacion':'Doble verificación en todas las cuentas','Reporte Incidentes':'Aviso de incidentes 3h / 72h / 15d','Delegado Ciberseguridad':'Delegado oficial de ciberseguridad','Plan Continuidad':'Plan para seguir operando ante una crisis','Cifrado AES / TLS':'Cifrado al enviar y al guardar datos','Auditoria Pentest':'Simulacros de ataque y auditorías','Capacitacion':'Capacitación recurrente del personal','Evaluacion Riesgos':'Evaluación de riesgos formal','Monitoreo SOC 24x7':'Vigilancia y respuesta las 24 horas','Canal Disclosure':'Canal público de alertas (security.txt)','Due Diligence Terceros':'Revisión de proveedores y socios','Encargado de Prevencion':'Encargado de prevención designado (Art.4 Ley 20.393)','Matriz Riesgo Penal':'Matriz de riesgo penal de las actividades de la empresa','Protocolos Prevencion':'Protocolos internos de prevención y sanción','Canal Denuncias':'Canal seguro de denuncias, confidencial y anónimo','Evaluacion Independiente':'Evaluación periódica por entidad independiente'};
var gloss={
 'SGSI ISO 27001':['Tu sistema de gestión de seguridad','Es la forma de ordenar tus defensas. Ser ISO 27001 significa que ese sistema está por un estándar reconocido.'],
 'MFA Autenticacion':['Doble verificación','Además de la clave, pides un segundo dato (por ejemplo, un código al celular) para confirmar que eres tú.'],
 'Reporte Incidentes':['Aviso de incidentes','Un proceso para avisar rápido: alerta temprana en 3 horas, informe en 72 horas e informe final en 15 días.'],
 'Cifrado AES / TLS':['Cifrado de información','Conviertes los datos en un código para que nadie los lea: al enviarlos (TLS) y al guardarlos (AES).'],
 'Delegado Ciberseguridad':['Encargado de la seguridad','La persona responsable en tu empresa de cuidar la ciberseguridad.'],
 'Plan Continuidad':['Plan de respaldo','El plan para que tu empresa siga funcionando si ocurre una crisis o un ataque.'],
 'Auditoria Pentest':['Simulación de ataque','Expertos prueban tus defensas como si fueran un atador real, para encontrar los huecos.'],
 'Capacitacion':['Capacitación','Entrenar a tu personal para que no caiga en engaños y sepa reaccionar.'],
 'Evaluacion Riesgos':['Gestión de riesgos','Analizas los peligros sobre tu información y decides qué proteger primero.'],
 'Monitoreo SOC 24x7':['Vigilancia continua','Un equipo que vigila tus sistemas las 24 horas y actúa ante cualquier alerta.'],
 'Canal Disclosure':['Canal de alertas','Un aviso público para que personas buenas puedan avisarte de errores de seguridad.'],
 'Due Diligence Terceros':['Revisión de socios','Verificar que tus proveedores y socios cuiden la información antes de trabajar con ellos.'],
 'Encargado de Prevencion':['Encargado de prevención','La persona responsable de operar el modelo de prevención de delitos (Ley 20.393).'],
 'Matriz Riesgo Penal':['Matriz de riesgo penal','El mapa de delitos a los que tu empresa está expuesta y cómo prevenirlos.'],
 'Protocolos Prevencion':['Protocolos internos','Reglas internas de prevención y sanciones para evitar delitos económicos.'],
 'Canal Denuncias':['Canal de denuncias','Un canal confidencial y anónimo para reportar irregularidades sin miedo.'],
 'Evaluacion Independiente':['Evaluación independiente','Un tercero revisa periódicamente que tu modelo de prevención funcione.']

/* Cobertura de ley (semantica ROI): ley cubierta = TODOS los controles de sus estandares 'exige' implementados (union). */
function leyCobertura(laws){
 var out={};
 for(var i=0;i<laws.length;i++){var law=laws[i];var req=[],done=true;
  for(var s=0;s<STD_DEFS.length;s++){var sd=STD_DEFS[s];
   if(sd.leyes[law]==='exige'){for(var c=0;c<sd.ctrls.length;c++){var cc=sd.ctrls[c];
    if(req.indexOf(cc)<0)req.push(cc);if(diagHave.indexOf(cc)<0)done=false;}}}
  out[law]={req:req,covered:done};}
 return out;
}
/* Controles exigidos (union 'exige') por las leyes aplicables */
function ctrlUnion(laws){
 var u=[];
 for(var i=0;i<laws.length;i++){for(var s=0;s<STD_DEFS.length;s++){var sd=STD_DEFS[s];
  if(sd.leyes[laws[i]]==='exige'){for(var c=0;c<sd.ctrls.length;c++){if(u.indexOf(sd.ctrls[c])<0)u.push(sd.ctrls[c]);}}}}
 return u;

/* Jerarquia Ley -> Estandar -> Controles (igual que el sankey).
   Para cada ley aplicable: sus estandares EXIGE (obligatorios) y SATISFACE (referencia), con estado por control. */
function leyEstandares(laws){
 var out=[];
 for(var i=0;i<laws.length;i++){var l=laws[i];var exige=[],satf=[];
  for(var s=0;s<STD_DEFS.length;s++){var sd=STD_DEFS[s];var rel=sd.leyes[l];if(!rel)continue;
   var items=sd.ctrls.map(function(c){return {ctrl:c,on:diagHave.indexOf(c)>=0};});
   var done=items.filter(function(x){return x.on;}).length;
   var blk={std:sd.n,leyes:sd.leyes,rel:rel,items:items,done:done,total:items.length};
   if(rel==='exige')exige.push(blk);else satf.push(blk);}

 return out;
}
/* Prioridad (orden ROI 'cerrar por proximidad'): controles faltantes ordenados por PROXIMIDAD
   a cerrar una ley — cuántos controles quedan por implementar en la ley más cercana tras
   aplicar este control. prox 0 = hito ◆ (completa una ley), luego 1, 2, ... Así "llenar una ley"
   manda sin depender de que exista multa: NCG/21.595 a 1 paso gana ante 21.663 a 20 pasos.
   Desempate: severidad de la ley que cierran/tocan (penal > multas), nº de leyes, orden canónico. */
function prioControles(laws,lc){
 var pri={};
 for(var l=0;l<laws.length;l++){if(lc[laws[l]].covered)continue;
  var req=lc[laws[l]].req;
  var faltan=req.filter(function(c){return diagHave.indexOf(c)<0;}).length;
  for(var i=0;i<req.length;i++){var c=req[i];
   if(diagHave.indexOf(c)>=0)continue;
   if(!pri[c])pri[c]={n:0,sev:0,prox:9999,completa:{},toca:{}};
   pri[c].n++;pri[c].sev=Math.max(pri[c].sev,lawSev(laws[l]));pri[c].toca[laws[l]]=true;
   if((faltan-1)<pri[c].prox)pri[c].prox=faltan-1;
   if(faltan===1)pri[c].completa[laws[l]]=true;}}
 var list=[];
 for(var c3 in pri){var p=pri[c3];
  var comp=Object.keys(p.completa),toca=Object.keys(p.toca);
  var compSev=0;comp.forEach(function(l){compSev=Math.max(compSev,lawSev(l));});
  list.push({ctrl:c3,n:p.n,sev:p.sev,prox:p.prox,completa:comp,compSev:compSev,laws:toca});}
 list.sort(function(a,b){
  if(a.prox!==b.prox)return a.prox-b.prox;
  var ah=a.completa.length>0,bh=b.completa.length>0;
  if(ah!==bh)return ah?-1:1;
  if(ah&&bh&&b.compSev!==a.compSev)return b.compSev-a.compSev;
  if(b.sev!==a.sev)return b.sev-a.sev;
  if(b.n!==a.n)return b.n-a.n;
  return CTRLS.indexOf(a.ctrl)-CTRLS.indexOf(b.ctrl);});
 return list;
}

function ctrlsFueraContexto(laws){

/* ===== ROI de Cumplimiento: Matriz de Cobertura Legal por Control =====
   Replica el chart 'ROI de Cumplimiento' del informe de convergencia (convergencia_normativa.html):
   filas = leyes aplicables con su techo de multa en UTM, o su tipo de sanción cuando no hay
   monto (21.595 = sanción penal con presidio; NCG 538 = sanción administrativa CMF);
   columnas = controles exigidos por al menos una ley aplicable, en orden de implementación
   'máxima cobertura primero' (nº de leyes que destapan, desempate por orden en STD_DEFS);
   celda coloreada = esa ley EXIGE ese control; ◆ = última celda requerida por la ley (hito de cobertura). */
var SHORTCTRL={'SGSI ISO 27001':'SGSI','Evaluacion Riesgos':'Riesgos','Auditoria Pentest':'Pentest','Capacitacion':'Capacitac.','Due Diligence Terceros':'DD Terceros','Plan Continuidad':'Continuidad','Monitoreo SOC 24x7':'SOC','Delegado Ciberseguridad':'Delegado','MFA Autenticacion':'MFA','Cifrado AES / TLS':'Cifrado','Reporte Incidentes':'Reporte Inc.','Canal Disclosure':'Canal Disc.','Encargado de Prevencion':'Enc. Prev.','Matriz Riesgo Penal':'Matriz Penal','Protocolos Prevencion':'Protocolos','Canal Denuncias':'Denuncias','Evaluacion Independiente':'Eval. Indep.'};
function roiMat(laws,lc){
  var uni=ctrlUnion(laws);
  function covers(ctrl){var n=0;for(var i=0;i<laws.length;i++){if(lc[laws[i]].req.indexOf(ctrl)>=0)n++;}return n;}
  function sev(ctrl){var s=0;for(var i=0;i<laws.length;i++){if(lc[laws[i]].req.indexOf(ctrl)>=0)s=Math.max(s,lawSev(laws[i]));}return s;}
  var order=uni.slice().sort(function(a,b){var sa=sev(a),sb=sev(b);if(sb!==sa)return sb-sa;var ca=covers(a),cb=covers(b);if(cb!==ca)return cb-ca;return CTRLS.indexOf(a)-CTRLS.indexOf(b);});
  var idx={};order.forEach(function(c,i){idx[c]=i;});
  var doneAt={};
  laws.forEach(function(l){var last=-1;lc[l].req.forEach(function(c){if(idx[c]>last)last=idx[c];});doneAt[l]=last;});
  return {order:order,doneAt:doneAt,reqOf:lc,laws:laws};
}

  h+='<div class="dst" style="font-size:12px;color:var(--dim);margin-top:8px">Celda de color = control <b>exigido</b> por esa ley. <b>◆</b> = último control que completa la ley (hito de cobertura). En la priorización manda la <b>proximidad</b>: primero los hitos (◆) que completan leyes, luego los que más las acercan a cerrarse, sin importar que haya multa — una ley sin multa UTM a 1 paso gana ante una con multa a muchos pasos. La severidad (riesgo penal y multa del techo) desempata. Las leyes sin multa en UTM <b>igual sancionan</b>: 21.595 = penal (presidio), NCG 538 = administrativa CMF (multas/inhabilidades).</div>';
  h+='</div>';
  return h;
}
